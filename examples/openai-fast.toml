# Supply OPENAI_API_KEY in the launcher environment. Keep this config outside the workspace.
auth = "api_key"
wire_api = "responses"
model = "gpt-6-luna"
reasoning_effort = "low"
service_tier = "fast"  # opt-in: premium processing; depends on account/model access
max_model_requests = 10
max_subagents = 10
