name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Verify dependency license coverage across release targets
        run: |
          cargo fetch --locked
          python3 -B -m unittest discover -s scripts -p test_licenses.py
          python3 -B scripts/licenses.py --check
      - run: cargo clippy --locked --all-targets -- -D warnings
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, platform: darwin-x64, target: x86_64-apple-darwin }
          - { os: macos-15, platform: darwin-arm64, target: aarch64-apple-darwin }
          - { os: windows-2025, platform: win32-x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, platform: win32-arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PIKO_BIN: target/${{ matrix.target }}/release/piko${{ startsWith(matrix.platform, 'win32') && '.exe' || '' }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
          run_install: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools ripgrep
      - run: cargo test --locked --all-targets
      - if: runner.os != 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --target '${{ matrix.target }}'
      - run: python tests/stdio.py
      - run: python tests/computer_native.py
      - name: Prepare disposable Windows ARM64 desktop
        if: matrix.platform == 'win32-arm64'
        shell: pwsh
        run: ./tests/prepare-windows-desktop.ps1
      - name: Verify native desktop input in isolated Windows fixture
        if: runner.os == 'Windows'
        env:
          PIKO_NATIVE_DESKTOP_TEST: '1'
        run: python tests/computer_native.py
      - run: python tests/reliability.py
      - run: python tests/providers.py
      - run: python tests/tools.py
      - name: Verify bounded session and subagent pools
        run: |
          python -B tests/scalability.py --binary "$PIKO_BIN" --sessions 128 --model-concurrency 8 --active-turns 8 --cancel-queued 8 --resident-history-bytes 0 --turns 3 --samples 2 --output "$RUNNER_TEMP/piko-scale-sessions-${{ matrix.platform }}.json"
          python -B tests/subagent_scalability.py --binary "$PIKO_BIN" --agents 64 --model-concurrency 8 --samples 2 --output "$RUNNER_TEMP/piko-scale-children-${{ matrix.platform }}.json"
          python -B tests/long_history_benchmark.py --binary "$PIKO_BIN" --sessions 4 --history-mib 1 --samples 2 --output "$RUNNER_TEMP/piko-scale-history-${{ matrix.platform }}.json"
      - name: Preserve native scale verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-perf-${{ matrix.platform }}
          path: ${{ runner.temp }}/piko-scale-*.json
          if-no-files-found: error
          retention-days: 7
      - run: pnpm test:release
      - run: python -B -m unittest discover -s scripts -p test_verify_release.py
      - run: pnpm test:package
      - run: pnpm test:install
      - name: Stage and pack native npm package
        run: |
          node scripts/package.cjs --platform '${{ matrix.platform }}' --binary "$PIKO_BIN" --out "$RUNNER_TEMP/native-package"
          mkdir -p "$RUNNER_TEMP/artifacts"
          pnpm --dir "$RUNNER_TEMP/native-package" pack --out "$RUNNER_TEMP/artifacts/native-${{ matrix.platform }}.tgz"
          python scripts/archive.py --binary "$PIKO_BIN" --platform '${{ matrix.platform }}' --out "$RUNNER_TEMP/artifacts"
          python scripts/verify-package.py "$RUNNER_TEMP/artifacts/native-${{ matrix.platform }}.tgz" '${{ matrix.platform }}'
          python scripts/verify-archive.py "$RUNNER_TEMP/artifacts"/piko-*-"${{ matrix.platform }}".${{ startsWith(matrix.platform, 'win32') && 'zip' || 'tar.gz' }} "$RUNNER_TEMP/artifacts/native-${{ matrix.platform }}.tgz" '${{ matrix.platform }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          retention-days: 7
