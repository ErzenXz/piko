name: Native size evaluation
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - '.cargo/**'
      - 'src/**'
      - 'tests/size_benchmark.py'
      - 'tests/test_size_benchmark.py'
      - 'tests/memory_benchmark.py'
      - 'tests/stdio.py'
      - 'tests/tls.py'
      - 'tests/tls.rs'
      - 'tests/fixtures/**'
      - 'scripts/size-evaluation.py'
      - '.github/workflows/size.yml'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git revision used for the before build
        required: false
        default: e584e13b56a6f8730a3da7e200fba98726f17e36
        type: string
permissions:
  contents: read
concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: Size ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, platform: darwin-x64, target: x86_64-apple-darwin }
          - { os: macos-15, platform: darwin-arm64, target: aarch64-apple-darwin }
          - { os: windows-2025, platform: win32-x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, platform: win32-arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      BASELINE_REF: ${{ inputs.baseline_ref || 'e584e13b56a6f8730a3da7e200fba98726f17e36' }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build both revisions and measure seven alternating pairs
        run: >-
          python -B scripts/size-evaluation.py compare
          --baseline "$BASELINE_REF" --platform '${{ matrix.platform }}'
          --target '${{ matrix.target }}' --rounds 7 --sessions 32
          --output "$RUNNER_TEMP/piko-size-${{ matrix.platform }}.json"
      - name: Preserve native before and after measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-size-${{ matrix.platform }}
          path: ${{ runner.temp }}/piko-size-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
  native-tls:
    name: Native TLS experiment ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: darwin-arm64, target: aarch64-apple-darwin }
          - { os: windows-2025, platform: win32-x64, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Measure isolated native TLS candidate and verify protocol compatibility
        run: >-
          python -B scripts/size-evaluation.py native-tls
          --platform '${{ matrix.platform }}' --target '${{ matrix.target }}'
          --output "$RUNNER_TEMP/piko-native-tls-${{ matrix.platform }}.json"
      - name: Preserve native TLS experiment and exact test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-native-tls-${{ matrix.platform }}
          path: ${{ runner.temp }}/piko-native-tls-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
